[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pawclip"
version = "0.1.0"
description = "Batch AI pet video generation with the Vidu API, with a credit guard"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pawclip = "pawclip.cli:main"

[tool.setuptools]
packages = ["pawclip"]
