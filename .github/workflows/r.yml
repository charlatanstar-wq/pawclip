name: collect
on:
  push:
    branches: [vibe-render]
permissions: {contents: write, actions: read}
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: o, merge-multiple: true, run-id: 41496706936, github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: actions/download-artifact@v4
        with: {path: o, merge-multiple: true, run-id: 41497098855, github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: actions/download-artifact@v4
        with: {path: o, merge-multiple: true, run-id: 41497255156, github-token: '${{ secrets.GITHUB_TOKEN }}'}
      - run: |
          cd o && ls -la && git init -q -b vibe-out && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git vibe-out:vibe-out
