name: ming-tts
on:
  push:
    branches: [ming-tts]
jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        ep: [ep13, ep14, ep15, ep16, ep17, ep18, ep19, ep20, ep21, ep22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}
      - name: deps
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers==4.46.3 tokenizers accelerate==1.3.0 "huggingface_hub<1" numpy soundfile==0.12.1 tqdm loguru x_transformers==2.9.2 diffusers==0.33.0 onnxruntime inflect einops packaging
          git clone -q --depth 1 https://github.com/inclusionAI/Ming-3.0-tts.git
          sed -i "s/torch.autocast(device_type='cuda', dtype=torch.bfloat16)/torch.autocast(device_type=('cuda' if torch.cuda.is_available() else 'cpu'), dtype=torch.bfloat16, enabled=torch.cuda.is_available())/" Ming-3.0-tts/modeling_bailingmm.py
          sed -i "s/prompt_waveform.to(device=self.device, dtype=torch.bfloat16)/prompt_waveform.to(device=self.device, dtype=next(self.parameters()).dtype)/" Ming-3.0-tts/modeling_bailingmm.py
          python -c "from huggingface_hub import snapshot_download;snapshot_download('inclusionAI/Ming-3.0-tts-0.5B',local_dir='model')"
      - name: synth
        run: python run.py jobs/${{ matrix.ep }}.json 2>&1 | grep -E "^(try|done|Trace|  File|[A-Za-z]*Error)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.ep }}
          path: out/${{ matrix.ep }}
  asr:
    needs: tts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: out}
      - run: sudo apt-get install -y -q ffmpeg >/dev/null && pip install -q faster-whisper && python asr.py
      - uses: actions/upload-artifact@v4
        with: {name: asr, path: asr.json}
