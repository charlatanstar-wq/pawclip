name: ming-tts
on:
  push:
    branches: [ming-tts]
jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -q ffmpeg >/dev/null && pip install -q faster-whisper && python asr.py
      - uses: actions/upload-artifact@v4
        with: {name: asr, path: asr.json}
