name: collect
on:
  push:
    branches: [ming-tts]
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          run-id: 41493877852
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cd out && git init -q -b ming-out && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm out
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ming-out
